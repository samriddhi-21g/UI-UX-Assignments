
<!DOCTYPE html>
<html>
<head>
    <title>Student Object</title>
</head>
<body>

    <h2>Student Information</h2>

    <script>

        // Creating a student object
        let student = {
            name: "Rahul",
            age: 20,
            grades: 85
        };

        // Adding a new property
        student.class = "B.Tech CSE";

        // Updating the student's grade
        student.grades = 92;

        // Displaying student information
        document.write("<h3>Student Details</h3>");

        document.write("Name: " + student.name + "<br>");
        document.write("Age: " + student.age + "<br>");
        document.write("Class: " + student.class + "<br>");
        document.write("Grade: " + student.grades);

    </script>

</body>
</html>
