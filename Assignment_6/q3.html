
<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form>

        <label>Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name">
        <br><br>

        <label>Email:</label><br>
        <input type="text" id="email" placeholder="Enter your email">
        <br><br>

        <label>Age:</label><br>
        <input type="text" id="age" placeholder="Enter your age">
        <br><br>

        <button type="button" id="submitBtn">Submit</button>

    </form>

    <p id="result"></p>

    <script>

        // Selecting HTML elements
        let name = document.getElementById("name");
        let email = document.getElementById("email");
        let age = document.getElementById("age");
        let result = document.getElementById("result");
        let submitBtn = document.getElementById("submitBtn");

        // Function to validate the form
        function validateForm() {

            let nameValue = name.value.trim();
            let emailValue = email.value.trim();
            let ageValue = age.value.trim();

            // Checking name
            if (nameValue === "") {
                result.textContent = "Please enter your name.";
                return;
            }

            // Checking email format
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(emailValue)) {
                result.textContent = "Please enter a valid email.";
                return;
            }

            // Checking age
            if (ageValue === "" || isNaN(ageValue)) {
                result.textContent = "Please enter a valid number for age.";
                return;
            }

            let ageNumber = Number(ageValue);

            if (ageNumber < 18 || ageNumber > 100) {
                result.textContent = "Age must be between 18 and 100.";
                return;
            }

            result.textContent = "Form submitted successfully!";

        }

        // Adding click event
        submitBtn.addEventListener("click", validateForm);

    </script>

</body>
</html>
