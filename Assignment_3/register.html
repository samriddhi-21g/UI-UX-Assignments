<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Saturnalia 2026</title>
    <link rel="stylesheet" href="./Styles/register.css">
</head>

<body>

<header>
    <div class="logo">SATURNALIA</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html" class="active">Register</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQs</a>
    </nav>
</header>

<section class="page-heading">
    <h1>REGISTER</h1>
    <p>Ready to be part of Saturnalia?</p>
</section>

<section class="form-section">

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>

        <label>College / University</label>
        <input type="text" placeholder="Enter your college name" required>

        <label>Year of Study</label>
        <select>
            <option>Select your year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Select Event</label>
        <select>
            <option>Select an event</option>
            <option>Sat Hack</option>
            <option>Ideathon</option>
            <option>Mirage</option>
            <option>Battle of Bands</option>
            <option>Sat Walk</option>
            <option>Group Western Dance</option>
            <option>Punjabi Dance</option>
        </select>

        <label>Team Name (if applicable)</label>
        <input type="text" placeholder="Enter team name">

        <label>Message</label>
        <textarea rows="4" placeholder="Any additional information"></textarea>

        <button type="submit" class="button">SUBMIT REGISTRATION</button>

    </form>

</section>

<footer>
    <p>© 2026 Saturnalia | Thapar Institute of Engineering & Technology</p>
</footer>

</body>
</html>
