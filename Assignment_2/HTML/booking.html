<!DOCTYPE html>
<html>
    <head>
        <title>Booking</title>
    </head>
    <body>
        <h1>Booking form</h1>
        
        <form>
            <label>Full name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Travel Date</label>
            <input type="date">

            <label>Package</label>
            <select>
                <option>Goa</option>
                <option>Manali</option>
                <option>Ladakh</option>
                <option>Coorg</option>
                <option>Mumbai</option>
                <option>Kutch</option>
            </select>

            <label>Number of Travellers</label>
            <input type="Number">

            <button type="submit">Book Now</button>
        </form>

    </body>
</html>
