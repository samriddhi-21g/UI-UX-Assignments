
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | WanderVista</title>
    <link rel="stylesheet" href="../Styles/booking.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">WanderVista</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="booking.html" class="active">Booking</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About Us</a>
        </div>
    </nav>

    <!-- Booking Section -->
    <section class="booking-section">

        <h1>Plan Your Journey</h1>
        <p class="subtitle">Fill in the details below to book your dream vacation.</p>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="date">Travel Date</label>
            <input type="date" id="date" required>

            <label for="package">Select Package</label>
            <select id="package" required>
                <option value="">Choose a destination</option>
                <option>Goa</option>
                <option>Manali</option>
                <option>Ladakh</option>
                <option>Coorg</option>
                <option>Mumbai</option>
                <option>Kutch</option>
            </select>

            <label for="travellers">Number of Travellers</label>
            <input type="number" id="travellers" min="1" max="20" placeholder="Enter number of travellers" required>

            <button type="submit">Book Now</button>
        </form>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 WanderVista Travels | Explore. Experience. Enjoy.</p>
    </footer>

</body>
</html>
